<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade FPY013V - Ejecutor en Vivo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #10b981; /* Verde consola */
            --accent-hover: #059669;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra Lateral */
        #sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        #lista-juegos {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        #lista-juegos li {
            padding: 12px;
            margin-bottom: 8px;
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #lista-juegos li:hover {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
        }

        #lista-juegos li.activo {
            background-color: var(--accent-hover);
            color: white;
            font-weight: bold;
        }

        /* Contenedor Principal Central (Código) */
        #centro {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #334155;
            overflow: hidden;
        }

        #area-codigo {
            flex-grow: 1;
            overflow: auto;
            border-radius: 8px;
            background: #1d1f21;
        }

        pre { margin: 0 !important; height: 100%; }

        /* Consola Derecha (Ejecución en Vivo) */
        #consola-panel {
            width: 400px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        #output-consola {
            flex-grow: 1;
            background-color: #050505;
            border: 1px solid #22c55e;
            color: #22c55e;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            overflow-y: auto;
            white-space: pre-wrap;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .controles-consola {
            display: flex;
            gap: 10px;
        }

        #input-usuario {
            flex-grow: 1;
            background: #111;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
        }

        #btn-run {
            background-color: var(--accent-color);
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        #btn-run:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }

        .loading { text-align: center; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>🕹️ Alumnos Arcade</h2>
        <ul id="lista-juegos">
            <div class="loading">Cargando repositorio...</div>
        </ul>
    </div>

    <div id="centro">
        <div>
            <h1 id="titulo-juego" style="margin:0 0 5px 0; font-size:1.5rem;">Selecciona un juego</h1>
            <p id="autor-juego" style="margin:0 0 15px 0; color:#94a3b8;">Revisa el código e inicialo en la consola remota.</p>
        </div>
        <div id="area-codigo">
            <pre><code id="codigo-python" class="language-python"># El código aparecerá aquí...</code></pre>
        </div>
    </div>

    <div id="consola-panel">
        <h2 style="color: #22c55e; margin-bottom: 10px;">📟 Consola Interactiva Python</h2>
        <div id="output-consola">Esperando inicialización de entorno...</div>
        <div class="controles-consola">
            <input type="text" id="input-usuario" placeholder="Escribe aquí y presiona Enter..." disabled>
            <button id="btn-run" disabled>▶ JUGAR</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <script>
        // CONFIGURACIÓN OBLIGATORIA DE GITHUB
        const USUARIO_GITHUB = "TU_USUARIO_DE_GITHUB"; 
        const REPOSITORIO_GITHUB = "NOMBRE_DE_TU_REPOSITORIO";

        let pyodideInstance = null;
        let codigoActual = "";
        let resolucionInput = null;

        const listaUI = document.getElementById('lista-juegos');
        const tituloUI = document.getElementById('titulo-juego');
        const autorUI = document.getElementById('autor-juego');
        const codigoUI = document.getElementById('codigo-python');
        const consolaUI = document.getElementById('output-consola');
        const btnRun = document.getElementById('btn-run');
        const inputUsuario = document.getElementById('input-usuario');

        // Inicializar el motor de Python WebAssembly al cargar la página
        async function inicializarPython() {
            consolaUI.textContent = "⏳ Cargando motor de Python en el navegador...\n";
            try {
                pyodideInstance = await loadPyodide();
                consolaUI.textContent += "✅ ¡Motor Python Listo!\nSelecciona un juego para comenzar.";
                btnRun.disabled = false;
            } catch(e) {
                consolaUI.textContent = "❌ Error al cargar Python: " + e.message;
            }
        }

        // Leer archivos de GitHub
        async function obtenerArchivos() {
    // Forzamos que no use caché de GitHub para evitar respuestas viejas
    const url = `https://api.github.com/repos/${USUARIO_GITHUB}/${REPOSITORIO_GITHUB}/contents/juegos?nocache=${new Date().getTime()}`;
    
    try {
        console.log("Consultando API de GitHub en:", url);
        const res = await fetch(url);
        
        if (!res.ok) {
            if (res.status === 404) {
                throw new Error(`No se encontró la carpeta 'juegos'. Asegúrate de que el usuario [${USUARIO_GITHUB}] y el repositorio [${REPOSITORIO_GITHUB}] estén bien escritos en las constantes del HTML.`);
            } else if (res.status === 403) {
                throw new Error("Límite de peticiones de GitHub alcanzado (Rate Limit). Espera unos minutos o usa otra red.");
            } else {
                throw new Error(`Error de GitHub: ${res.status} ${res.statusText}`);
            }
        }
        
        const archivos = await res.json();
        console.log("Archivos detectados en GitHub:", archivos);
        
        listaUI.innerHTML = "";
        
        // Filtramos asegurando que termine en .py sin importar mayúsculas/minúsculas
        const scripts = archivos.filter(f => f.name.toLowerCase().endsWith('.py') && f.name.toLowerCase() !== '__init__.py');
        
        if (scripts.length === 0) {
            listaUI.innerHTML = "<div class='loading'>La carpeta 'juegos' existe en GitHub, pero está vacía o no tiene archivos .py</div>";
            return;
        }
        
        scripts.forEach(archivo => {
            const li = document.createElement('li');
            // Formateo visual del nombre del archivo por mientras
            const nombreLimpio = archivo.name.replace(/\.py$/i, '').replace(/_/g, ' ').toUpperCase();
            li.textContent = `🎮 ${nombreLimpio}`;
            
            li.addEventListener('click', () => {
                document.querySelectorAll('#lista-juegos li').forEach(el => el.classList.remove('activo'));
                li.classList.add('activo');
                descargarCodigo(archivo.download_url, nombreLimpio, archivo.name);
            });
            listaUI.appendChild(li);
        });
        
    } catch (err) {
        console.error("Error completo:", err);
        listaUI.innerHTML = `<div class='loading' style='color:#f87171;'>⚠️ ${err.message}</div>`;
    }
}

        async function descargarCodigo(url, estudiante, archivo) {
            tituloUI.textContent = archivo;
            autorUI.textContent = `Desarrollado por: ${estudiante}`;
            codigoUI.textContent = "# Descargando archivo...";
            Prism.highlightElement(codigoUI);

            try {
                const res = await fetch(url);
                codigoActual = await res.text();
                codigoUI.textContent = codigoActual;
                Prism.highlightElement(codigoUI);
                consolaUI.textContent = `[ ${archivo} cargado ]\nPresiona el botón "▶ JUGAR" para ejecutarlo en vivo.`;
            } catch (e) {
                codigoUI.textContent = "# Error al descargar";
            }
        }

        // Capturar los "print()" de Python y mandarlos a la consola HTML
        function inicializarSalidaConsola() {
            consolaUI.textContent = "";
            pyodideInstance.setStdout({
                batched: (text) => {
                    consolaUI.textContent += text + "\n";
                    consolaUI.scrollTop = consolaUI.scrollHeight;
                }
            });
        }

        // Manejar la petición "input()" de Python interceptándola desde JavaScript
        inputUsuario.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && resolucionInput) {
                const valor = inputUsuario.value;
                consolaUI.textContent += valor + "\n"; // Mostrar lo que el usuario escribió
                inputUsuario.value = "";
                inputUsuario.disabled = true;
                
                let resolver = resolucionInput;
                resolucionInput = null;
                resolver(valor); // Devuelve el dato a Python
            }
        });

        function simularInput(promptText) {
            if(promptText) consolaUI.textContent += promptText;
            consolaUI.scrollTop = consolaUI.scrollHeight;
            inputUsuario.disabled = false;
            inputUsuario.focus();
            
            return new Promise((resolve) => {
                resolucionInput = resolve;
            });
        }

        // Ejecutar el script del estudiante en vivo
        btnRun.addEventListener('click', async () => {
            if (!codigoActual) return alert("Selecciona un juego primero");
            
            btnRun.disabled = true;
            inicializarSalidaConsola();
            
            // Inyectar la simulación de input de JS al ecosistema de Python
            pyodideInstance.registerJsModule("js_input", { pedir_datos: simularInput });
            
            // Re-escribimos dinámicamente la función integrada input() de Python para que use nuestra interfaz HTML
            const wrapperCodigo = `
import builtins
import js_input
import asyncio

async def custom_input(prompt=""):
    # Llamamos a JavaScript y esperamos a que el estudiante responda
    resultado = await js_input.pedir_datos(prompt)
    return resultado

builtins.input = custom_input

# Ejecutar el código del estudiante
async def inicio():
    try:
        # Cargamos el archivo del alumno
        namespace = {}
        exec("""${codigoActual.replace(/\\/g, '\\\\').replace(/"""/g, '\\"\\"\\"').replace(/`/g, '\\`')}""", namespace)
        
        # Ejecutamos su función obligatoria
        if "ejecutar_juego" in namespace:
            if asyncio.iscoroutinefunction(namespace["ejecutar_juego"]):
                await namespace["ejecutar_juego"]()
            else:
                # Si la función llama a input(), ahora es asíncrona tras bambalinas
                await pyodide.eval_code_async("${codigoActual.replace(/\\/g, '\\\\').replace(/"""/g, '\\"\\"\\"').replace(/`/g, '\\`')} \\nejecutar_juego()")
        else:
            print("⚠️ Error: No se encontró la función 'ejecutar_juego()'")
    except Exception as err:
        print(f"❌ Error en la ejecución: {err}")

await inicio()
`;
            try {
                await pyodideInstance.runPythonAsync(wrapperCodigo);
            } catch (err) {
                consolaUI.textContent += `\n❌ Error crítico: ${err.message}`;
            } finally {
                btnRun.disabled = false;
                inputUsuario.disabled = true;
            }
        });

        // Correr al iniciar
        inicializarPython();
        obtenerArchivos();
    </script>
</body>
</html>
